name: Seite bauen und veroeffentlichen

# Kein Modellaufruf in der Cloud. Die Artikel entstehen lokal auf deinem
# Rechner und werden committet. Hier wird nur gebaut und deployed, damit der
# Workflow ohne API-Key und ohne Kosten laeuft.

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'config/**'
      - 'site/**'
      - 'src/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# Actions sind auf feste Commits gepinnt statt auf Tags. Ein Tag kann
# nachträglich umgehängt werden, ein Commit nicht.

# Jeder Job bekommt nur die Rechte, die er braucht. Der Build führt Code aus
# dem Repository aus und darf deshalb nichts veröffentlichen.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Preflight und Build
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
